name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Check required secrets are configured
        run: |
          missing=0
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then echo "::error::Add repository secret CLOUDFLARE_API_TOKEN (Cloudflare API token with Pages + Account read)"; missing=1; fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then echo "::error::Add repository secret CLOUDFLARE_ACCOUNT_ID (Cloudflare account ID from dashboard sidebar)"; missing=1; fi
          exit "$missing"

      - run: npm ci

      - name: Production build (Web3Forms key from GitHub Secret)
        run: npm run build
        env:
          REACT_APP_WEB3FORMS_ACCESS_KEY: ${{ secrets.REACT_APP_WEB3FORMS_ACCESS_KEY }}

      - name: Deploy build folder to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG: info
        run: npx wrangler@4 pages deploy build --project-name=jpcwebsite-deploy
